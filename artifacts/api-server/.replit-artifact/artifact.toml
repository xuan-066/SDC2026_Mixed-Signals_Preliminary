kind = "api"
previewPath = "/api"
title = "SejukGuard Python API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/v1", "/health", "/docs", "/openapi.json", "/redoc"]

[services.development]
run = "pnpm --filter @workspace/api-server run dev"

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["bash", "artifacts/api-server/start-python.sh"]

[services.production.run.env]
PORT = "8080"

[services.production.health.startup]
path = "/health"
