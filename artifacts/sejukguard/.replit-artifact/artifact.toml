kind = "web"
previewPath = "/"
title = "Glacier Link"
description = "Glacier Link is a cold-chain response workspace for Malaysian kitchens, helping teams prioritize incidents, protect stock, and coordinate approvals and vendor response."
version = "1.0.0"
id = "artifacts/sejukguard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18810

[services.development]
run = "pnpm --filter @workspace/sejukguard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sejukguard", "run", "build" ]
serve = "static"
publicDir = "artifacts/sejukguard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18810"
BASE_PATH = "/"
